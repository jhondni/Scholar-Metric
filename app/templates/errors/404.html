{% extends "base.html" %}
{% block title %}Página não encontrada{% endblock %}
{% block page_title %}Erro 404{% endblock %}

{% block content %}
<div class="empty-state" style="min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <i class="fas fa-search empty-state-icon" style="font-size: 4rem;"></i>
    <h2 class="empty-state-title">Página não encontrada</h2>
    <p class="empty-state-text">A página que você procura não existe ou foi movida.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Voltar ao Dashboard</a>
</div>
{% endblock %}
